name: Pruebas automáticas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  pruebas:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencia de pruebas visuales
        run: python -m pip install "Pillow>=11,<13"
      - name: Validar sintaxis
        run: python -m compileall -q main.py circo tests
      - name: Ejecutar batería (sin Pygame)
        run: python -m unittest discover -s tests -v
