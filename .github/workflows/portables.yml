name: Compilar Circo Dimensional 2 (AppImage y EXE)

on:
  workflow_dispatch:

jobs:
  linux_appimage:
    name: AppImage Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencia de pruebas visuales
        run: python -m pip install "Pillow>=11,<13"
      - name: Comprobar tests
        run: python -m unittest discover -s tests -v
      - name: Crear AppImage
        run: bash tools/crear_appimage_linux.sh
      - name: Publicar AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Circo-Dimensional-2-Linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  windows_exe:
    name: EXE Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencia de pruebas visuales
        run: python -m pip install "Pillow>=11,<13"
      - name: Comprobar tests
        run: python -m unittest discover -s tests -v
      - name: Crear EXE
        shell: pwsh
        run: ./tools/crear_exe_windows.ps1
      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: Circo-Dimensional-2-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
